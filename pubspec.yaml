name: viserpay
description: A new Flutter project.

publish_to: 'none'
version: 1.2.7+12

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_advanced_switch: ^3.0.1
  change_app_package_name: ^1.1.0
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^19.4.1
  flutter_spinkit: ^5.1.0
  flutter_svg: ^2.0.4
  flutter_widget_from_html: ^0.17.2
  get: ^4.6.6
  http: ^1.1.2
  im_stepper: ^1.0.1+1
  image_picker: ^1.2.2
  intl: ^0.20.2
  local_auth: ^2.1.7
  lottie: ^3.1.2
  octo_image: ^2.0.0
  open_file: ^3.3.2
  path_provider: ^2.1.3
  permission_handler: ^12.0.1
  pdf: ^3.10.2
  pin_code_fields: ^8.0.1
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.0.0
  share_plus: ^11.1.0
  shared_preferences: ^2.3.2          # ← was ^2.0.13 (too old)
  shimmer: ^3.0.0
  url_launcher: ^6.2.2
  vibration: ^3.1.3
  flutter_exit_app: ^1.1.2
  another_flushbar: ^1.12.30
  animated_text_kit: ^4.2.2
  awesome_dialog: ^3.1.0
  cached_network_image: ^3.3.0
  carousel_slider: ^5.0.0
  circular_countdown_timer: ^0.2.3
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.2
  dio: ^5.4.3+1
  dots_indicator: ^4.0.1
  dotted_border: ^2.0.0+2
  expandable_page_view: ^1.0.17
  fast_contacts: ^4.0.0
  file_manager: ^1.0.2
  file_picker: ^10.3.2
  firebase_core: ^4.1.0
  firebase_core_platform_interface: ^6.0.0
  firebase_messaging: ^16.0.1
  flutter_animate: ^4.5.0
  zoom_tap_animation: ^1.1.0
  cloud_firestore: ^6.0.1
  firebase_auth: ^6.0.2
  restart_app: ^1.2.1
  flutter_phone_direct_caller: ^2.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  # Already added
  shared_preferences_android: ^2.3.3
  path_provider_android: ^2.2.15
  url_launcher_android: ^6.3.4
  image_picker_android: ^0.8.12+2
  permission_handler_android: ^12.0.1

  # Current fix
  video_player_android: ^2.7.14

  # Comprehensive pre-emptive overrides for ALL common v1-embedding offenders
  webview_flutter_android: ^4.3.0
  camera_android: ^0.10.9+6
  local_auth_android: ^1.0.43
  file_picker: ^10.3.2
  connectivity_plus: ^6.1.1
  share_plus: ^10.0.0
  in_app_purchase_android: ^0.3.5
  flutter_local_notifications: ^19.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo/
    - assets/icon/
    - assets/img/
    - assets/animation/

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Bold.ttf
        - asset: assets/fonts/Rajdhani-Light.ttf
        - asset: assets/fonts/Rajdhani-Medium.ttf
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Black.ttf
        - asset: assets/fonts/Inter-Bold.ttf
        - asset: assets/fonts/Inter-ExtraLight.ttf
        - asset: assets/fonts/Inter-Light.ttf
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
        - asset: assets/fonts/Inter-Thin.ttf
